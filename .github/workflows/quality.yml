name: Quality

# React + Rust/Tauri 质量门禁与桌面烟测。
# dev 是测试分支，main 是受保护的正式发布分支。
on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/quality-core.yml
    permissions:
      contents: read
