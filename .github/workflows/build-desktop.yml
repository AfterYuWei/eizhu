name: Electron four-target foundation
on:
  push:
    branches: ['codex/electron-stage-1']
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - '*config*.json'
      - '*config*.mjs'
      - 'VERSION'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [test, stable]
        default: test
      validation:
        description: '仅烟测工具修改且回归已通过时，可选择 package-only 避免重复单测'
        type: choice
        options: [full, package-only]
        default: full
  workflow_call:
    inputs:
      channel:
        type: string
        default: test
      validation:
        type: string
        default: full
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, platform: win32, arch: x64, installer: '*.exe' }
          - { os: macos-15-intel, platform: darwin, arch: x64, installer: '*.dmg' }
          - { os: macos-15, platform: darwin, arch: arm64, installer: '*.dmg' }
          - { os: ubuntu-22.04, platform: linux, arch: x64, installer: '*.AppImage' }
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      EIZHU_CHANNEL: ${{ inputs.channel || 'test' }}
      VITE_EIZHU_CHANNEL: ${{ inputs.channel || 'test' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-15 xvfb rpm libsecret-1-0 libgtk-3-0 libnss3 libasound2
          echo 'CC=clang-15' >> "$GITHUB_ENV"
          echo 'CXX=clang++-15' >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run check
      - if: inputs.validation != 'package-only' && !contains(github.event.head_commit.message, '[package-only]')
        run: npm run test:foundation
      - if: inputs.validation != 'package-only' && !contains(github.event.head_commit.message, '[package-only]')
        run: npm run baseline:test
      - run: npm run desktop:build
      - run: npm run desktop:package -- --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}
      - name: Smoke final installer contents (macOS / Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: node scripts/smoke-package.mjs artifacts/desktop/${{ matrix.installer }}
      - name: Smoke final AppImage contents under X11
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a node scripts/smoke-package.mjs artifacts/desktop/${{ matrix.installer }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eizhu-${{ inputs.channel || 'test' }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            artifacts/desktop/*.*
            artifacts/smoke/**
